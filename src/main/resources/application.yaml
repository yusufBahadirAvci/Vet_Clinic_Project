spring:
  application:
    name: vetclinic
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/vetclinic
    username: vetclinic
    password: vetclinic
  mail:
    host: localhost
    port: 1025
  flyway:
    enabled: true
    # Schema only. The dev (and later docker) profile adds classpath:db/seed.
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
