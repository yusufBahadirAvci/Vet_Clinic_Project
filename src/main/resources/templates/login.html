<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <h1 class="h3 mb-3">Log in</h1>
            <p class="text-muted">We will send a 6-digit verification code to your e-mail address or mobile number.</p>

            <form th:action="@{/login}" th:object="${loginForm}" method="post" novalidate>
                <div class="mb-3">
                    <label for="contact" class="form-label">E-mail or mobile number</label>
                    <input type="text" id="contact" th:field="*{contact}" class="form-control"
                           th:classappend="${#fields.hasErrors('contact')} ? 'is-invalid'"
                           autocomplete="username" autofocus required>
                    <div class="invalid-feedback" th:errors="*{contact}">Enter a valid e-mail address or mobile number</div>
                </div>
                <button type="submit" class="btn btn-success w-100">Send code</button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
