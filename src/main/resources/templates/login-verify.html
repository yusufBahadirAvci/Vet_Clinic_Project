<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Verify your code')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <h1 class="h3 mb-3">Enter your code</h1>
            <p class="text-muted">
                If your details are registered, a code was sent to
                <strong th:text="${maskedContact}">c*****@gmail.com</strong>.
            </p>

            <form th:action="@{/login/verify}" th:object="${verifyForm}" method="post" novalidate>
                <div class="mb-3">
                    <label for="code" class="form-label">6-digit code</label>
                    <input type="text" id="code" th:field="*{code}" class="form-control form-control-lg text-center"
                           th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                           inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                           autocomplete="one-time-code" autofocus required>
                    <div class="invalid-feedback" th:errors="*{code}">The code is invalid or has expired</div>
                </div>
                <button type="submit" class="btn btn-success w-100">Log in</button>
            </form>

            <form th:action="@{/login/resend}" method="post" class="mt-3 text-center">
                <button type="submit" class="btn btn-link">Send a new code</button>
            </form>
            <p class="text-center"><a th:href="@{/login}">Use a different e-mail or number</a></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
