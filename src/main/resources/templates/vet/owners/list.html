<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Owners')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Owners</h1>
        <a class="btn btn-success" th:href="@{/vet/owners/new}">Add owner</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/vet/owners}" role="search">
        <div class="col-12 col-md-8 col-lg-6">
            <label for="q" class="visually-hidden">Search</label>
            <input type="search" class="form-control" id="q" name="q" th:value="${q}"
                   placeholder="Name, e-mail or phone (e.g. 0532 123 45 67)">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-success">Search</button>
            <a th:if="${q}" class="btn btn-link" th:href="@{/vet/owners}">Clear</a>
        </div>
    </form>

    <p th:if="${owners.empty}" class="text-muted">No owners found.</p>

    <div class="table-responsive" th:unless="${owners.empty}">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">E-mail</th>
                <th scope="col">Phone</th>
                <th scope="col">Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${owners.content}">
                <td><a th:href="@{/vet/owners/{id}(id=${o.id})}" th:text="${o.fullName}">Ayşe Demir</a></td>
                <td th:text="${o.email} ?: '–'">ayse@example.com</td>
                <td th:text="${o.phone} ?: '–'">+905321234567</td>
                <td>
                    <span th:if="${o.active}" class="badge bg-success">Active</span>
                    <span th:unless="${o.active}" class="badge bg-secondary">Inactive</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${owners.totalPages > 1}" aria-label="Owner pages"
         class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <a class="btn btn-outline-secondary btn-sm" th:classappend="${owners.first} ? 'disabled'"
           th:href="@{/vet/owners(q=${q},page=${owners.number - 1})}">Previous</a>
        <span class="text-muted small"
              th:text="|Page ${owners.number + 1} of ${owners.totalPages} · ${owners.totalElements} owners|">Page 1 of 2</span>
        <a class="btn btn-outline-secondary btn-sm" th:classappend="${owners.last} ? 'disabled'"
           th:href="@{/vet/owners(q=${q},page=${owners.number + 1})}">Next</a>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
