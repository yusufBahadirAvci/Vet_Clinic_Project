<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pets')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Pets</h1>
        <a class="btn btn-success" th:href="@{/vet/pets/new}">Add pet</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/vet/pets}" th:object="${filter}" role="search">
        <div class="col-12 col-md-5">
            <label for="q" class="visually-hidden">Search</label>
            <input type="search" class="form-control" th:field="*{q}" placeholder="Name or microchip number">
        </div>
        <div class="col-6 col-md-2">
            <label for="species" class="visually-hidden">Species</label>
            <select class="form-select" th:field="*{species}">
                <option value="">All species</option>
                <option th:each="s : ${speciesOptions}" th:value="${s.key}" th:text="${s.value}">Dog</option>
            </select>
        </div>
        <div class="col-6 col-md-3">
            <label for="ownership" class="visually-hidden">Owner</label>
            <select class="form-select" th:field="*{ownership}">
                <option value="ALL">With and without owner</option>
                <option value="OWNED">With owner</option>
                <option value="OWNERLESS">Without owner</option>
            </select>
        </div>
        <div class="col-12 col-md-2 d-grid">
            <button type="submit" class="btn btn-outline-success">Filter</button>
        </div>
    </form>

    <p th:if="${pets.empty}" class="text-muted">No pets found.</p>

    <div class="table-responsive" th:unless="${pets.empty}">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Species / breed</th>
                <th scope="col">Age</th>
                <th scope="col">Microchip</th>
                <th scope="col">Owner</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pets.content}">
                <td><a th:href="@{/vet/pets/{id}(id=${p.id})}" th:text="${p.name}">Max</a></td>
                <td th:text="${p.breed} ? |${p.species} · ${p.breed}| : ${p.species}">Dog</td>
                <td th:text="${p.age}">3 years</td>
                <td th:text="${p.microchipNo} ?: '–'">792097000100001</td>
                <td>
                    <a th:if="${p.ownerId}" th:href="@{/vet/owners/{id}(id=${p.ownerId})}" th:text="${p.ownerName}">Ayşe</a>
                    <span th:unless="${p.ownerId}" class="badge bg-warning text-dark">No owner</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${pets.totalPages > 1}" aria-label="Pet pages"
         class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <a class="btn btn-outline-secondary btn-sm" th:classappend="${pets.first} ? 'disabled'"
           th:href="@{/vet/pets(q=${filter.q},species=${filter.species},ownership=${filter.ownership},page=${pets.number - 1})}">Previous</a>
        <span class="text-muted small"
              th:text="|Page ${pets.number + 1} of ${pets.totalPages} · ${pets.totalElements} pets|">Page 1 of 2</span>
        <a class="btn btn-outline-secondary btn-sm" th:classappend="${pets.last} ? 'disabled'"
           th:href="@{/vet/pets(q=${filter.q},species=${filter.species},ownership=${filter.ownership},page=${pets.number + 1})}">Next</a>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
