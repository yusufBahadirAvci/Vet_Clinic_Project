<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dev login')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <h1 class="h3">Dev login</h1>
    <p class="text-muted">Development profile only. Pick a seeded user to log in without a one-time code.</p>

    <div class="list-group">
        <form th:each="u : ${users}" th:action="@{/dev/login/{id}(id=${u.id})}" method="post"
              class="list-group-item d-flex justify-content-between align-items-center">
            <span>
                <span th:text="${u.fullName}">Full name</span>
                <span class="badge bg-secondary ms-2" th:text="${u.role}">ROLE</span>
            </span>
            <button type="submit" class="btn btn-sm btn-success">Log in</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
